name: Rules Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm --workspace eslint-plugin run build
      - run: node scripts/validate-manifest.js

  boilerplate-9-gate-regression:
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - name: Checkout rules
        uses: actions/checkout@v4
        with:
          path: rules
      - name: Checkout boilerplate (sample service)
        uses: actions/checkout@v4
        with:
          repository: OPEN-Healthcare/ohc-changemgmt-hub-service-boilerplate
          path: boilerplate
          token: ${{ secrets.HUB_RULES_REGRESSION_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build rules plugin
        working-directory: rules
        run: npm install && npm --workspace eslint-plugin run build
      - name: Install boilerplate
        working-directory: boilerplate
        run: npm ci
      - name: Run boilerplate gates with new rules
        working-directory: boilerplate
        env:
          OHC_RULES_PLUGIN_PATH: ${{ github.workspace }}/rules/eslint-plugin/dist/index.js
        run: |
          npm run lint --if-present
          npm test --if-present -- --passWithNoTests
          npm run build --if-present
      - name: Manifest schema diff (PR only)
        if: github.event_name == 'pull_request'
        working-directory: rules
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git diff origin/${{ github.base_ref }} -- rules/manifest.json || true
